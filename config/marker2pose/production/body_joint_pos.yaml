NAME: Marker2Pose
DEVICE: [ 0 ]
CUDA: TRUE
SEED: 1024
TYPE: "marker2pose"
DESCRIPTION: "Test for Marker2Pose"

DATA:
  root_dir: "."

  body_type: "production"
  finger_type: "5"
  train_part: "body"
  test_part: "body"
  window_size: 64
  use_wrist: False
  #  rot_repr: "mat_full"
  rot_repr: "joint_pos"
  #  test_mem_sample_rate: 0.05
  #  train_mem_sample_rate: 0.05
  test_mem_sample_rate: 1.0
  train_mem_sample_rate: 1.0
  use_window: true

  h5_path: "samples/solving/sample.h5"
  train_list_path: "assets/full_body_training_set_PART512_WINDOW64_SEED1024.txt"
#  train_list_path: "assets/full_body_tiny_set_PART512_WINDOW64_SEED1024.txt"
  test_list_path: "assets/full_body_tiny_set_PART512_WINDOW64_SEED1024.txt"
#  test_list_path: "assets/full_body_tiny_set_PART512_WINDOW64_SEED1024.txt"

  #  train_list_path: "assets/network_test.txt"
  #  test_list_path: "assets/network_test.txt"

  connect_mat_path: "assets/connect_mat/production_mat_std_3.npy"
  marker_name_config_path: "assets/marker_names.json"
  body_joint_name_config_path: "assets/joint_config_body.txt"
  left_hand_joint_name_config_path: "assets/joint_config_left_hand.txt"
  right_hand_joint_name_config_path: "assets/joint_config_right_hand.txt"
  full_body_joint_name_config_path: "assets/joint_config_full_body.txt"

  wrist_marker_pos_mean_std_path: ""
  marker_pos_mean_std_path: "assets/mean_std/production/body/fix_occlusion_marker_pos.npz"
  joint_pos_mean_std_path: "assets/mean_std/production/body/joint_pos.npz"
  motion_mat_mean_std_path: "assets/mean_std/production/body/motion_mat.npz"
  motion_trans_mean_std_path: "assets/mean_std/production/body/motion_trans.npz"
  weight_mean_std_path: "assets/mean_std/production/body/weights.npz"
  joint_offset_mean_std_path: "assets/mean_std/production/body/t_pose.npz"

  cos_twist_mean_std_path: "assets/mean_std/production/body/cos_twist.npz"
  sin_twist_mean_std_path: "assets/mean_std/production/body/sin_twist.npz"

  no_twist_joint_idx: [ 0,5,6,11,12,16,17,24,25,26 ]

LOG:
  save_dir: "../Logs"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  code_dir: "code"
  res_dir: "res"
  overwrite: True
  save_code: True
  tensorboard_port: 6008
  no_code_dir_list: [ ]

NETWORK:
  type: "HeteroGraphModel"
  network_dim: [ 0, 1024, 1024, 1024, 0 ]
  marker_gcn_dim: [ 4, 8, 16 ]
  marker_gcn_act: [ "Mish", "Mish", "Mish" ]
  act_fun: [ "Mish", "ReLU", "ReLU", "ReLU" ]
  skeleton_gcn_dim: [ 40, 20, 0 ]
  skeleton_gcn_act: [ "Mish", "Mish", "Mish" ]
  marker_skeleton_conv_gcn_dim: [ [ 16, 30 ], [ 30, 40 ], [ 40, 30 ] ]
  marker_skeleton_conv_gcn_act: [ "Mish", "Mish", "Mish" ]


TRAIN:
#  batch_size: 1
  batch_size: 512
  optimizer:
    type: RMSprop
    args:
      lr: 1e-3
      alpha: 0.99
      eps: 1e-8
      weight_decay: 0
      momentum: 0.1
      centered: false
  lr_scheduler:
    type: StepLR
    args:
      verbose: true
      step_size: 30
      gamma: 0.3
  #  early_stopping:
  #    monitor: val_total_loss
  #    min_delta: 0.0
  #    patience: 8
  #    verbose: true
  #    mode: min
  epoch_num: 150
  dropout: 0.2
  resume_checkpoint: "checkpoints/solving/production.ckpt"
  log_interval: 10
  save_interval: 50

  motion_loss_weight: 4.0
  joint_offset_loss_weight: 2.0
  joint_pos_loss_weight: 1.0
  angle_error_weight: 0.0
  phi_loss_weight: 100.0


EVAL:
  jitter_intensity: 0.0
  only_eval: true
  export_res: true
  calc_foot_slide: false

